<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>

  <!-- Scanning Viewfinder Corners (QR & RFID Scanner) -->
  <path d="M 104 168 L 104 120 A 16 16 0 0 1 120 104 L 168 104" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>
  <path d="M 344 104 L 392 104 A 16 16 0 0 1 408 120 L 408 168" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>
  <path d="M 408 344 L 408 392 A 16 16 0 0 1 392 408 L 344 408" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>
  <path d="M 168 408 L 120 408 A 16 16 0 0 1 104 392 L 104 344" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round"/>

  <!-- QR Matrix Targets in Corners -->
  <rect x="132" y="132" width="34" height="34" rx="8" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="346" y="132" width="34" height="34" rx="8" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="132" y="346" width="34" height="34" rx="8" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Isometric 3D Asset Cube in Center -->
  <!-- Top Face -->
  <polygon points="256,168 344,218 256,268 168,218" fill="url(#boxTop)"/>
  <!-- Left Face -->
  <polygon points="168,218 256,268 256,368 168,318" fill="url(#boxLeft)"/>
  <!-- Right Face -->
  <polygon points="256,268 344,218 344,318 256,368" fill="url(#boxRight)"/>

  <!-- Asset Box Edges Highlight -->
  <polyline points="168,218 256,268 344,218" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4"/>
  <line x1="256" y1="268" x2="256" y2="368" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Scanning Laser Line with Glow -->
  <line x1="88" y1="256" x2="424" y2="256" stroke="url(#laserGrad)" stroke-width="8"/>
</svg>
